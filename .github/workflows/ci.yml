name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest -q
      - name: README examples
        run: |
          primeops-replay show --trade-id T1001 --as-of 2026-11-18T09:50:00+08:00 | grep BREAK_SHORT
          primeops-replay show --trade-id T1001 --as-of 2026-11-18T09:53:00+08:00 | grep MATCHED
          primeops-replay show --engine sql --trade-id T1001 --as-of 2026-11-18T09:50:00+08:00 | grep BREAK_SHORT
          primeops-replay report --as-of 2026-11-18T11:00:00+08:00 --out breaks.csv && cat breaks.csv
