[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "primeops-replay"
version = "1.3.0"
description = "Point-in-time reconciliation of broker executions and client trade allocations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Souvik Guha" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.0.3", "hypothesis==6.168.5", "ruff==0.7.4", "mypy==1.13.0"]

[project.scripts]
primeops-replay = "primeops_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
primeops_replay = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
